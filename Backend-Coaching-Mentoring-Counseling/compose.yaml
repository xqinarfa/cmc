services:
  postgres:
    image: postgres:16-alpine
    container_name: cmc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cmc_user
      POSTGRES_PASSWORD: cmc_password
      POSTGRES_DB: cmc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmc_user -d cmc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cmc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: cmc-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  minio:
    image: minio/minio:latest
    container_name: cmc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus:latest
    container_name: cmc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmc-app
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      APP_NAME: coaching-mentoring-counseling
      APP_ENV: production
      LOG_LEVEL: info
      LOG_FORMAT: json
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: cmc_user
      DB_PASSWORD: cmc_password
      DB_NAME: cmc_db
      DB_SSL_MODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NATS_URL: nats://nats:4222
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_NAME: cmc-assets
      JWT_SECRET_KEY: your-super-secret-jwt-key-change-this-in-production-min-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  nats_data:
  minio_data:
