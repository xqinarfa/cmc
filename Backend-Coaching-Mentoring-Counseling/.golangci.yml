run:
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor
    - tmp
    - internal/delivery/grpc/proto

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - gofmt
    - misspell
    - unconvert
    - revive

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
