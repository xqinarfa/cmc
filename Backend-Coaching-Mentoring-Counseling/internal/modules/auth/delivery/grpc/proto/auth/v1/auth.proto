syntax = "proto3";

package auth.v1;

option go_package = "github.com/kalanara/cmc-backend/internal/modules/auth/delivery/grpc/proto/auth/v1;authv1";

service AuthService {
  rpc VerifyToken (VerifyTokenRequest) returns (VerifyTokenResponse);
  rpc GetUserInfo (GetUserInfoRequest) returns (GetUserInfoResponse);
}

message VerifyTokenRequest {
  string token = 1;
}

message VerifyTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  string role = 4;
  string error_message = 5;
}

message GetUserInfoRequest {
  string user_id = 1;
}

message GetUserInfoResponse {
  string id = 1;
  string email = 2;
  string full_name = 3;
  string role = 4;
  string phone = 5;
  bool is_active = 6;
}
