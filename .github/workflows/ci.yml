name: CI Pipeline (Quality Gate Before CD)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend-Coaching-Mentoring-Counseling
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: Backend-Coaching-Mentoring-Counseling/go.sum

      - name: Verify Go Modules
        run: go mod verify

      - name: Run Go Vet Linter
        run: go vet ./...

      - name: Run Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ./Backend-Coaching-Mentoring-Counseling
          args: --timeout=5m
        continue-on-error: true

      - name: Run Unit Tests with Race & Coverage
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./internal/... ./pkg/... ./test/unit

      - name: Validate Binary Builds
        run: |
          go build -v -o /dev/null ./cmd/api
          go build -v -o /dev/null ./cmd/migrate

  frontend-ci:
    name: Frontend Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend-Coaching-Mentoring-Counseling
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend-Coaching-Mentoring-Counseling/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run type-check

      - name: Run Vitest Unit Tests
        run: npm run test

      - name: Validate Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_BASE_URL: https://cmc.hulunautika.com
          NEXT_TELEMETRY_DISABLED: 1

  ci-gate:
    name: Quality Gate (Ready for CD)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Quality Gate Passed
        run: |
          echo "================================================="
          echo "ALL LINTERS AND UNIT TESTS PASSED SUCCESSFULLY!"
          echo "Backend and Frontend modules verified."
          echo "System is certified ready for Continuous Delivery (CD)."
          echo "================================================="

